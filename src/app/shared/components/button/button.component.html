<button
  [type]="type"
  [disabled]="disabled || loading"
  [class]="buttonClasses"
  (click)="onClick($event)"
>
  @if (loading) {
    <svg [lucideIcon]="loaderIcon" class="size-4 animate-spin"></svg>
  } @else if (icon) {
    <svg [lucideIcon]="icon" class="size-4"></svg>
  }
  <span>
    <ng-content></ng-content>
  </span>
</button>
